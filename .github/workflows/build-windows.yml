name: Build Windows

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        part: [ app, plugins-1, plugins-2, plugins-3, plugins-4 ]
    steps:
      - uses: actions/checkout@v5

      - name: Fetch ASIO SDK (optional)
        if: matrix.part == 'app'
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip
          Expand-Archive asiosdk.zip -DestinationPath asio
          $dir = Get-ChildItem asio -Directory | Select-Object -First 1
          echo "ASIO_DIR=$($dir.FullName)" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          $part = "${{ matrix.part }}"
          $app = if ($part -eq "app") { "ON" } else { "OFF" }
          $plg = if ($part -like "plugins-*") { "ON" } else { "OFF" }
          $grp = if ($part -like "plugins-*") { $part.Substring(8) } else { "0" }
          cmake -S . -B build -A x64 -DGUBEE_BUILD_APP=$app -DGUBEE_BUILD_PLUGINS=$plg "-DGUBEE_PLUGIN_GROUP=$grp" "-DGUBEE_ASIO_SDK_DIR=$env:ASIO_DIR" *>&1 | Tee-Object -FilePath ci.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4 -- /m /p:CL_MPCount=4 /v:minimal *>&1 | Tee-Object -FilePath ci.log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          if ("${{ matrix.part }}" -eq "app") {
            New-Item -ItemType Directory -Force out/App | Out-Null
            Copy-Item build/GubeeLoops_artefacts/Release/GubeeLoops.exe out/App/
          } else {
            New-Item -ItemType Directory -Force out/Plugins | Out-Null
            Get-ChildItem build -Recurse -Directory -Filter *.vst3 |
              Where-Object { $_.FullName -match 'Release\\VST3\\[^\\]+\.vst3$' } |
              ForEach-Object { Copy-Item $_.FullName -Destination out/Plugins/ -Recurse -Force }
          }
          Get-ChildItem out -Recurse | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: gubee-${{ matrix.part }}
          path: out

      - name: Publish failure log
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logpub | Out-Null
          if (Test-Path ci.log) {
            Select-String -Path ci.log -Pattern "error|Error|CMake Error|fatal" | Select-Object -First 300 | ForEach-Object { $_.Line } | Out-File logpub/errors.txt
            Get-Content ci.log -Tail 400 | Out-File logpub/tail.txt
          } else { "no log" | Out-File logpub/errors.txt }
          cd logpub
          git init -q -b ci-log-${{ matrix.part }}
          git config user.name "gubee-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI failure log ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log-${{ matrix.part }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Push binaries to the 'windows-build' branch
        run: |
          mkdir pub && cd pub
          git init -q -b windows-build
          cp -r ../dl/gubee-app/* .
          for d in ../dl/gubee-plugins-*; do cp -r "$d"/* .; done
          echo "Built from ${GITHUB_SHA} on $(date -u)" > BUILD_INFO.txt
          git config user.name "gubee-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Windows build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" windows-build
